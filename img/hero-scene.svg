<!-- viewBox is set from measured painted bounds (x 236-546, y 46-514 with the
     arch's base disc) so the scene carries even air on every side.
     PHONES nudged +14,+14 on 2026-09-02 (owner: "push these phones a little
     to the right and push them a little down") — the two translate() wrappers
     below, NOT the arch or envelope. Headroom was measured first: phone 1 now
     clears the viewBox right edge by 11 units. Pushed a further +16 DOWN
     the same day on her follow-up; phone 2 now keeps 52 units of bottom
     clearance, so there is still room for another nudge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="221 31 340 498" fill="none" role="img" aria-label="Two phones in front of a plum arch on a round base, playing an animated digital wedding invitation">
<defs>
<linearGradient id="arch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#852e61"/><stop offset="1" stop-color="#3a0c27"/></linearGradient>
<linearGradient id="scr1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdf9f3"/><stop offset="1" stop-color="#f3e8d9"/></linearGradient>
<linearGradient id="scr2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3eaef"/><stop offset="1" stop-color="#e8d7e1"/></linearGradient>
<linearGradient id="hscSeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcc08e"/><stop offset="1" stop-color="#b99a63"/></linearGradient>
<linearGradient id="hscShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="ph1"><rect x="316" y="30" width="132" height="272" rx="22"/></clipPath>
<clipPath id="ph2"><rect x="196" y="130" width="124" height="256" rx="21"/></clipPath>
<clipPath id="hscArch"><path d="M258 500 V190 a144 144 0 0 1 288 0 V500 Z"/></clipPath>
</defs>
<style>
/* Motion measured on the reference: phone sway = x 0 to -12px with -5deg
   over 3s and back over 3s, linear (Tilda sbs keyframes, 6s loop).
   Screen loop = 12.5s to match the reference video duration. */
.hsc-sway,.hsc-float,.hsc-scroll,.hsc-env,.hsc-petal,.hsc-dove,.hsc-shine,.hsc-tap,.hsc-pulse{transform-box:fill-box}
.hsc-sway{animation:hscSway 6s linear infinite;transform-origin:center}
.hsc-float{animation:hscFloat 7s ease-in-out infinite;transform-origin:center}
.hsc-scroll{animation:hscScroll 12.5s ease-in-out infinite}
.hsc-env{animation:hscEnv 12.5s linear infinite}
.hsc-tap{animation:hscTap 1.8s ease-in-out infinite;transform-origin:center}
.hsc-pulse{animation:hscPulse 2.4s ease-in-out infinite;transform-origin:center}
.hsc-shine{animation:hscShine 12.5s ease-in-out infinite}
.hsc-petal{animation:hscPetalA 9s linear infinite;transform-origin:center}
.hsc-petal.b{animation-name:hscPetalB;animation-duration:11s}
.hsc-petal.p2{animation-delay:-3s}.hsc-petal.p3{animation-delay:-6s}
.hsc-dove{animation:hscDove 12.5s ease-in-out infinite}
.hsc-dove.d2{animation-delay:-6s}
@keyframes hscSway{0%{transform:translateX(0) rotate(0deg)}50%{transform:translateX(-12px) rotate(-5deg)}100%{transform:translateX(0) rotate(0deg)}}
@keyframes hscFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes hscScroll{0%,28%{transform:translateY(0)}36%,54%{transform:translateY(-272px)}62%,92.8%{transform:translateY(-544px)}93.2%,100%{transform:translateY(0)}}
@keyframes hscEnv{0%,10.4%{opacity:1}16%,86.4%{opacity:0}92.8%,100%{opacity:1}}
@keyframes hscTap{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes hscPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes hscShine{0%,18%{transform:translateX(-180px);opacity:0}26%{opacity:.5}40%,100%{transform:translateX(500px);opacity:0}}
@keyframes hscPetalA{0%{transform:translate(0,-10px) rotate(0deg);opacity:0}8%{opacity:.9}80%{opacity:.9}100%{transform:translate(-26px,300px) rotate(-150deg);opacity:0}}
@keyframes hscPetalB{0%{transform:translate(0,-10px) rotate(0deg);opacity:0}8%{opacity:.85}80%{opacity:.85}100%{transform:translate(24px,320px) rotate(160deg);opacity:0}}
@keyframes hscDove{0%,4%{transform:translate(-24px,12px);opacity:0}16%{opacity:.95}46%{transform:translate(38px,-8px);opacity:.95}60%,100%{transform:translate(66px,-16px);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .hsc-sway,.hsc-float,.hsc-scroll,.hsc-tap,.hsc-pulse,.hsc-shine,.hsc-petal,.hsc-dove{animation:none}
  .hsc-env{animation:none;opacity:0}
}
</style>
<!-- base disc the arch stands on: same width as the arch, only its lower half
     shows below the arch's bottom edge -->
<ellipse cx="402" cy="500" rx="144" ry="14" fill="#6b2049"/>
<path d="M258 500 V190 a144 144 0 0 1 288 0 V500 Z" fill="url(#arch)"/>
<g clip-path="url(#hscArch)">
  <g class="hsc-petal"    ><path d="M296 205 q5 -8 10 0 q-5 8 -10 0" fill="#f3e8d4" opacity=".9"/></g>
  <g class="hsc-petal b p2"><path d="M318 190 q5 -8 10 0 q-5 8 -10 0" fill="#e8d9be"/></g>
  <g class="hsc-petal p3" ><path d="M338 220 q4 -7 9 0 q-5 7 -9 0" fill="#f7efdf"/></g>
  <!-- two-arc gull silhouettes: the previous filled paths collapsed into lumpy
       ~20px blobs that read as smudges rather than birds -->
  <g class="hsc-dove"><path d="M298 122 q7.5 -8.5 15 0 q7.5 -8.5 15 0" fill="none" stroke="#fbf4f8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/></g>
  <g class="hsc-dove d2"><path d="M333 104 q6 -7 12 0 q6 -7 12 0" fill="none" stroke="#f6eaf1" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" opacity=".78"/></g>
  <rect class="hsc-shine" x="230" y="60" width="90" height="460" fill="url(#hscShine)" transform="skewX(-18)"/>
</g>
<g>
<g transform="translate(77 82)">
<g class="hsc-sway">
<g transform="rotate(8 382 166)">
  <rect x="310" y="24" width="144" height="284" rx="27" fill="#101418"/>
  <rect x="316" y="30" width="132" height="272" rx="22" fill="url(#scr1)"/>
  <g clip-path="url(#ph1)">
    <g class="hsc-scroll">
      <!-- panel 1 · names reveal (y 30-302) -->
      <text x="382" y="60" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="9" letter-spacing="2" fill="#a8916d">WEDDING DAY</text>
      <text x="382" y="96" text-anchor="middle" font-family="Beau Rivage, cursive" font-size="30" fill="#8a6f4d">Sara</text>
      <text x="382" y="132" text-anchor="middle" font-family="Beau Rivage, cursive" font-size="18" fill="#8a6f4d">and</text>
      <text x="382" y="168" text-anchor="middle" font-family="Beau Rivage, cursive" font-size="30" fill="#8a6f4d">Ahmad</text>
      <text x="382" y="224" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="10" fill="#a8916d">01 · 01 · 2027</text>
      <!-- panel 2 · countdown (y 302-574) -->
      <rect x="316" y="302" width="132" height="272" fill="#f6efe3"/>
      <path d="M316 302 l14 5 12 -4 14 5 13 -5 13 4 14 -5 12 4 14 -4 12 5 v6 h-128 z" fill="url(#scr1)"/>
      <text x="382" y="356" text-anchor="middle" font-family="Beau Rivage, cursive" font-size="21" fill="#7a5c3e">The Countdown</text>
      <text x="382" y="380" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="8.5" letter-spacing="1.6" fill="#a8916d">UNTIL WE SAY I DO</text>
      <g font-family="Rufina, serif" font-weight="700" font-size="16" fill="#5c4526" text-anchor="middle">
        <rect x="330" y="430" width="32" height="40" rx="8" fill="#fdf9f3" stroke="#dcc9a8" stroke-width="1"/>
        <rect x="366" y="430" width="32" height="40" rx="8" fill="#fdf9f3" stroke="#dcc9a8" stroke-width="1"/>
        <rect x="402" y="430" width="32" height="40" rx="8" fill="#fdf9f3" stroke="#dcc9a8" stroke-width="1"/>
        <text x="346" y="456">312</text>
        <text x="382" y="456">08</text>
        <text x="418" y="456">41</text>
      </g>
      <g font-family="Source Sans 3, sans-serif" font-size="6.5" letter-spacing="1" fill="#a8916d" text-anchor="middle">
        <text x="346" y="484">DAYS</text>
        <text x="382" y="484">HOURS</text>
        <text x="418" y="484">MINS</text>
      </g>
      <path d="M345 514 h22 M395 514 h22" stroke="#dcc9a8" stroke-width="1.5" stroke-linecap="round"/>
      <rect x="378.7" y="510.7" width="6.6" height="6.6" transform="rotate(45 382 514)" fill="#c9b28c"/>
      <!-- panel 3 · location + RSVP (y 574-846) -->
      <rect x="316" y="574" width="132" height="272" fill="url(#scr1)"/>
      <text x="382" y="622" text-anchor="middle" font-family="Beau Rivage, cursive" font-size="21" fill="#7a5c3e">Location</text>
      <text x="382" y="644" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="9" fill="#8a6f4d">Villa Fiore · Lakeside</text>
      <g stroke="#b39a72" stroke-width="1.3" fill="none">
        <path d="M334 712 h96"/>
        <path d="M342 712 v-22 a10 10 0 0 1 20 0 v22 M362 712 v-22 a10 10 0 0 1 20 0 v22 M382 712 v-22 a10 10 0 0 1 20 0 v22 M402 712 v-22 a10 10 0 0 1 20 0 v22"/>
        <path d="M334 676 h96 M340 676 l42 -24 42 24"/>
      </g>
      <g class="hsc-pulse"><rect x="349" y="756" width="66" height="20" rx="10" fill="#611b44"/>
      <text x="382" y="770" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="9" fill="#fff">RSVP</text></g>
    </g>
    <!-- envelope cover -->
    <g class="hsc-env">
      <rect x="316" y="30" width="132" height="272" fill="#f4efe6"/>
      <g fill="#e3dccd"><circle cx="334" cy="70" r="1.3"/><circle cx="420" cy="52" r="1.1"/><circle cx="366" cy="120" r="1.2"/><circle cx="436" cy="150" r="1.3"/><circle cx="330" cy="200" r="1.1"/><circle cx="410" cy="250" r="1.3"/><circle cx="352" cy="272" r="1.1"/></g>
      <path d="M316 46 L382 166 L448 46" stroke="#e6ddc9" stroke-width="1.4" fill="none"/>
      <path d="M316 292 L382 166 L448 292" stroke="#ece4d3" stroke-width="1.2" fill="none"/>
      <circle cx="382" cy="166" r="24" fill="url(#hscSeal)"/>
      <circle cx="382" cy="166" r="18.5" fill="none" stroke="#a8894f" stroke-width=".9" opacity=".7"/>
      <g fill="#c9ab73" stroke="#a8894f" stroke-width=".7">
        <ellipse cx="382" cy="157.5" rx="3.4" ry="5"/>
        <ellipse cx="390" cy="163" rx="3.4" ry="5" transform="rotate(70 390 163)"/>
        <ellipse cx="387" cy="172.5" rx="3.4" ry="5" transform="rotate(140 387 172.5)"/>
        <ellipse cx="377" cy="172.5" rx="3.4" ry="5" transform="rotate(-140 377 172.5)"/>
        <ellipse cx="374" cy="163" rx="3.4" ry="5" transform="rotate(-70 374 163)"/>
      </g>
      <circle cx="382" cy="165" r="2.4" fill="#8a6f3f"/>
      <text class="hsc-tap" x="382" y="216" text-anchor="middle" font-family="Rufina, serif" font-size="11" fill="#7a5c3e">Tap to open</text>
    </g>
  </g>
  <rect x="362" y="36" width="40" height="6" rx="3" fill="#101418"/>
</g>
</g>
</g>
</g>
<g>
<g transform="translate(76 78)">
<g class="hsc-float">
<g transform="rotate(-7 258 258)">
  <rect x="190" y="124" width="136" height="268" rx="26" fill="#14181c"/>
  <rect x="196" y="130" width="124" height="256" rx="21" fill="url(#scr2)"/>
  <g clip-path="url(#ph2)">
    <!-- blush save-the-date card. Replaces a flat mountain/sun scene that read as
         clipart and put dark purple type on a mid-purple ground; the arch frame
         echoes the scene's own arch and the rule matches the cream phone's. -->
    <rect x="196" y="130" width="124" height="256" fill="#f0e2e8"/>
    <!-- the cream card is ARCH-topped, not a rounded rect (owner, 2026-09-02):
         106 wide so r53, apex y160, springing y213 - it clears the pink arch
         line inside it by an even 5 units across the top and both sides. The
         bottom corners keep the old 7-unit rounding. -->
    <path d="M205 364 V213 a53 53 0 0 1 106 0 V364 a7 7 0 0 1 -7 7 H212 a7 7 0 0 1 -7 -7 Z" fill="#fdf8f5"/>
    <!-- the arch frame CLOSES at the bottom (owner, 2026-09-02: the legs used
         to stop at y348 and hang in mid-air, a leftover from when the card was
         a shorter rounded rect). Now it ends at y366 with a bottom rule, an
         even 5 units inside the card on all four sides. -->
    <path d="M210 366 V213 a48 48 0 0 1 96 0 V366 Z" fill="none" stroke="#cfa5b9" stroke-width="1.3" stroke-linejoin="round"/>
    <g stroke="#cfa5b9" stroke-width="1.1" fill="none" stroke-linecap="round">
      <path d="M258 205 v-14"/>
      <path d="M258 197 q-6 -2 -8 -8 q6 1 8 6"/>
      <path d="M258 197 q6 -2 8 -8 q-6 1 -8 6"/>
    </g>
    <circle cx="258" cy="189" r="1.6" fill="#b98aa2"/>
    <!-- 12.5, not 15: at 15 this line measures 95.5 units and burst through the
         82-unit arch on both sides. Arch widened to 96, line now 79.6. -->
    <text x="258" y="243" text-anchor="middle" font-family="Rufina, serif" font-weight="700" font-size="12.5" fill="#5d1c40">Save the Date</text>
    <text x="258" y="264" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="9" letter-spacing="1.4" fill="#8f5c78">01 · 01 · 2027</text>
    <path d="M228 282 h20 M268 282 h20" stroke="#d9b6c6" stroke-width="1.2" stroke-linecap="round"/>
    <rect x="254.7" y="278.7" width="6.6" height="6.6" transform="rotate(45 258 282)" fill="#cfa5b9"/>
    <g class="hsc-pulse"><rect x="222" y="312" width="72" height="20" rx="10" fill="#611b44"/>
    <text x="258" y="326" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="9" fill="#fff">RSVP</text></g>
  </g>
  <rect x="238" y="136" width="40" height="6" rx="3" fill="#14181c"/>
</g>
</g>
</g>
</g>
</svg>
